<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title description">
  <title id="title">Emrecan Gök, AI Engineer</title>
  <desc id="description">Hello, world. Emrecan Gök, AI Engineer, building LLM agents, RAG pipelines and computer vision systems. A small robot with glowing eyes floats inside a ring of agent states: question, router, retrieve, grade, generate, answer.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#13201B" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowGraph" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1F6F55" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1F6F55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="headFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3FAF6"/>
      <stop offset="1" stop-color="#CFE0D7"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#F5B342"/>
    </marker>

    <!-- typing reveals: widened one character at a time -->
    <clipPath id="type0"><rect x="70" y="92" height="28" width="0">
      <animate attributeName="width" begin="0.3s" dur="0.91s" fill="freeze" calcMode="discrete"
               values="0;15;30;45;60;75;90;105;120;135;150;165;180"/>
    </rect></clipPath>
    <clipPath id="type2"><rect x="70" y="212" height="40" width="0">
      <animate attributeName="width" begin="1.9s" dur="0.96s" fill="freeze" calcMode="discrete"
               values="0;18;36;54;72;90;108;126;144;162;180;198"/>
    </rect></clipPath>

    <clipPath id="card"><rect width="1200" height="420" rx="20"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
      .ring { fill: none; stroke: #2B3D35; stroke-width: 1.4; stroke-dasharray: 3 9; animation: dash 1.6s linear infinite; }
      .loop { fill: none; stroke: #F5B342; stroke-width: 1.4; stroke-dasharray: 4 6; stroke-opacity: .8; animation: dash 1.4s linear infinite; }
      .state { fill: #0F1915; stroke: #2B3D35; stroke-width: 1.4; }
      .lit { fill: #3DDC84; fill-opacity: .16; stroke: #3DDC84; stroke-width: 2; }
      .s-label { fill: #C9DAD1; font-size: 12px; }
      .fade { opacity: 0; animation: fadeIn .7s ease-out forwards; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .tw1 { animation: pulse 2.6s ease-in-out infinite; }
      .tw2 { animation: pulse 3.4s ease-in-out infinite .8s; }
      .tw3 { animation: pulse 4.2s ease-in-out infinite 1.6s; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .ring, .loop, .pulse, .tw1, .tw2, .tw3 { animation: none; }
        .fade { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <!-- background -->
    <rect width="1200" height="420" fill="#0A110E"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="1140" cy="20" r="170" fill="#3DDC84" fill-opacity=".06"/>
    <circle cx="10" cy="430" r="130" fill="#2DD4BF" fill-opacity=".06"/>
    <ellipse cx="920" cy="210" rx="300" ry="230" fill="url(#glowGraph)"/>

    <!-- twinkles -->
    <g fill="#3DDC84">
      <circle class="tw1" cx="612" cy="54" r="1.6"/>
      <circle class="tw2" cx="668" cy="372" r="1.4"/>
      <circle class="tw3" cx="1150" cy="92" r="1.8"/>
      <circle class="tw1" cx="1128" cy="356" r="1.4"/>
      <circle class="tw2" cx="704" cy="128" r="1.2"/>
      <circle class="tw3" cx="540" cy="388" r="1.4"/>
      <circle class="tw2" cx="1176" cy="226" r="1.2"/>
      <circle class="tw1" cx="36" cy="40" r="1.4"/>
    </g>

    <!-- left: intro -->
    <text class="mono" x="70" y="112" fill="#3DDC84" font-size="19" font-weight="600" textLength="180" lengthAdjust="spacing" clip-path="url(#type0)">HELLO, WORLD</text>
    <rect y="96" width="9" height="20" fill="#3DDC84" visibility="hidden">
      <set attributeName="visibility" to="visible" begin="0.3s"/>
      <set attributeName="visibility" to="hidden" begin="1.9s"/>
      <animate attributeName="x" begin="0.3s" dur="0.91s" fill="freeze" calcMode="discrete"
               values="72;87;102;117;132;147;162;177;192;207;222;237;252"/>
    </rect>

    <text class="sans fade" style="animation-delay: 1.2s" x="66" y="192" fill="#EEF6F1" font-size="68" font-weight="700" letter-spacing="-2">Emrecan Gök</text>

    <text class="mono" x="70" y="242" fill="url(#titleFill)" font-size="30" font-weight="700" textLength="198" lengthAdjust="spacingAndGlyphs" clip-path="url(#type2)">AI Engineer</text>
    <rect y="216" width="14" height="30" fill="#3DDC84" visibility="hidden">
      <set attributeName="visibility" to="visible" begin="1.9s"/>
      <animate attributeName="x" begin="1.9s" dur="0.96s" fill="freeze" calcMode="discrete"
               values="72;90;108;126;144;162;180;198;216;234;252;270"/>
      <animate attributeName="opacity" begin="2.9s" dur="1s" repeatCount="indefinite" calcMode="discrete"
               values="1;0" keyTimes="0;0.5"/>
    </rect>

    <g class="sans fade" style="animation-delay: 3s">
      <text x="70" y="290" fill="#A9BDB3" font-size="19">I build LLM agents, RAG pipelines</text>
      <text x="70" y="316" fill="#A9BDB3" font-size="19">and computer vision systems.</text>
    </g>

    <g class="mono" font-size="13">
      <g class="fade" style="animation-delay: 3.5s">
        <rect x="70" y="340" width="104" height="30" rx="15" fill="#0F1915" stroke="#2B3D35"/>
        <circle class="pulse" cx="88" cy="355" r="4" fill="#3DDC84"/>
        <text x="100" y="359.5" fill="#C9DAD1">LangGraph</text>
      </g>
      <g class="fade" style="animation-delay: 3.75s">
        <rect x="184" y="340" width="68" height="30" rx="15" fill="#0F1915" stroke="#2B3D35"/>
        <circle class="pulse" cx="202" cy="355" r="4" fill="#2DD4BF"/>
        <text x="214" y="359.5" fill="#C9DAD1">RAG</text>
      </g>
      <g class="fade" style="animation-delay: 4s">
        <rect x="262" y="340" width="150" height="30" rx="15" fill="#0F1915" stroke="#2B3D35"/>
        <circle class="pulse" cx="280" cy="355" r="4" fill="#F5B342"/>
        <text x="292" y="359.5" fill="#C9DAD1">Computer Vision</text>
      </g>
    </g>

    <!-- right: ring of agent states around the robot, center (920,210), radius 140 -->
    <circle class="ring" cx="920" cy="210" r="140"/>
    <circle cx="920" cy="210" r="104" fill="none" stroke="#3DDC84" stroke-opacity=".25" stroke-width="1" stroke-dasharray="14 12">
      <animateTransform attributeName="transform" type="rotate" from="0 920 210" to="360 920 210" dur="20s" repeatCount="indefinite"/>
    </circle>

    <!-- retry loop: grade back to retrieve -->
    <path class="loop" d="M951.6 389.2A182 182 0 0 0 1059.4 327" marker-end="url(#arrLoop)"/>
    <text class="mono" x="1022" y="392" fill="#F5B342" font-size="11" fill-opacity=".85">retry</text>

    <!-- robot mascot -->
    <ellipse cx="920" cy="266" rx="42" ry="6" fill="#000" fill-opacity=".35">
      <animate attributeName="rx" dur="3s" repeatCount="indefinite" values="42;36;42"/>
    </ellipse>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="3s" repeatCount="indefinite" values="0 0;0 -7;0 0"/>
      <!-- antenna -->
      <line x1="920" y1="160" x2="920" y2="140" stroke="#CFE0D7" stroke-width="4" stroke-linecap="round"/>
      <circle cx="920" cy="135" r="7" fill="#3DDC84" filter="url(#soft)">
        <animate attributeName="fill-opacity" dur="1.6s" repeatCount="indefinite" values="1;.25;1"/>
      </circle>
      <!-- ears -->
      <rect x="851" y="188" width="16" height="38" rx="8" fill="#2DD4BF"/>
      <rect x="973" y="188" width="16" height="38" rx="8" fill="#2DD4BF"/>
      <!-- head -->
      <rect x="862" y="158" width="116" height="96" rx="32" fill="url(#headFill)"/>
      <rect x="862" y="246" width="116" height="8" rx="4" fill="#B7CCC1" fill-opacity=".6"/>
      <!-- visor -->
      <rect x="875" y="176" width="90" height="54" rx="24" fill="#0B1310"/>
      <g fill="#3DDC84" filter="url(#soft)">
        <ellipse cx="901" cy="200" rx="7" ry="10">
          <animate attributeName="ry" dur="4s" repeatCount="indefinite" values="10;10;1;10;10" keyTimes="0;0.88;0.92;0.96;1"/>
        </ellipse>
        <ellipse cx="939" cy="200" rx="7" ry="10">
          <animate attributeName="ry" dur="4s" repeatCount="indefinite" values="10;10;1;10;10" keyTimes="0;0.88;0.92;0.96;1"/>
        </ellipse>
      </g>
      <path d="M911 216Q920 223 929 216" fill="none" stroke="#3DDC84" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="878" cy="242" r="2.5" fill="#3DDC84" class="pulse"/>
    </g>

    <!-- current state, shown under the robot -->
    <rect x="868" y="279" width="104" height="22" rx="11" fill="#0F1915" stroke="#2B3D35"/>
    <g class="mono" font-size="11" fill="#3DDC84" text-anchor="middle">
      <text x="920" y="294" opacity="0">listening…<animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.1667"/></text>
      <text x="920" y="294" opacity="0">routing…<animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1667;0.3333"/></text>
      <text x="920" y="294" opacity="0">retrieving…<animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3333;0.5"/></text>
      <text x="920" y="294" opacity="0">grading…<animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5;0.6667"/></text>
      <text x="920" y="294" opacity="0">generating…<animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6667;0.8333"/></text>
      <text x="920" y="294" opacity="0">answering…<animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.8333"/></text>
    </g>

    <!-- token travelling the ring under the states, with a short trail -->
    <g filter="url(#soft)">
      <circle r="2.5" fill="#3DDC84" opacity=".35">
        <animateMotion dur="6s" begin="-0.16s" repeatCount="indefinite" path="M920 70A140 140 0 0 1 920 350A140 140 0 0 1 920 70"/>
      </circle>
      <circle r="3.5" fill="#3DDC84" opacity=".6">
        <animateMotion dur="6s" begin="-0.08s" repeatCount="indefinite" path="M920 70A140 140 0 0 1 920 350A140 140 0 0 1 920 70"/>
      </circle>
      <circle r="5.5" fill="#EFFFF6">
        <animateMotion dur="6s" repeatCount="indefinite" path="M920 70A140 140 0 0 1 920 350A140 140 0 0 1 920 70"/>
      </circle>
    </g>

    <!-- states: base circle, lit overlay timed to the token, label -->
    <g class="mono" text-anchor="middle">
      <circle class="state" cx="920" cy="70" r="36"/>
      <circle class="lit" cx="920" cy="70" r="36" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="1;0;0" keyTimes="0;0.12;1"/></circle>
      <text class="s-label" x="920" y="74">question</text>

      <circle class="state" cx="1041.2" cy="140" r="36"/>
      <circle class="lit" cx="1041.2" cy="140" r="36" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.162;0.167;0.287;1"/></circle>
      <text class="s-label" x="1041.2" y="144">router</text>

      <circle class="state" cx="1041.2" cy="280" r="36"/>
      <circle class="lit" cx="1041.2" cy="280" r="36" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.328;0.333;0.453;1"/></circle>
      <text class="s-label" x="1041.2" y="284">retrieve</text>

      <circle class="state" cx="920" cy="350" r="36"/>
      <circle class="lit" cx="920" cy="350" r="36" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.495;0.5;0.62;1"/></circle>
      <text class="s-label" x="920" y="354">grade</text>

      <circle class="state" cx="798.8" cy="280" r="36"/>
      <circle class="lit" cx="798.8" cy="280" r="36" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.662;0.667;0.787;1"/></circle>
      <text class="s-label" x="798.8" y="284">generate</text>

      <circle class="state" cx="798.8" cy="140" r="36"/>
      <circle class="lit" cx="798.8" cy="140" r="36" opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.828;0.833;0.953;1"/></circle>
      <text class="s-label" x="798.8" y="144">answer</text>
    </g>

  </g>
</svg>
