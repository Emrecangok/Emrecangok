<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Emrecan Gök, AI Engineer: LLM agents, RAG and computer vision">
  <title>Emrecan Gök, AI Engineer: LLM agents, RAG and computer vision</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#14211C" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowLeft" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#16C172" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#16C172" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGraph" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1F6F55" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1F6F55" stop-opacity="0"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3DDC84"/>
    </marker>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#F5B342"/>
    </marker>
    <clipPath id="card"><rect width="1200" height="360" rx="24"/></clipPath>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
      .flow { fill: none; stroke: #3DDC84; stroke-width: 1.6; stroke-dasharray: 5 6; stroke-opacity: .85;
              animation: dash 1.1s linear infinite; }
      .loop { fill: none; stroke: #F5B342; stroke-width: 1.4; stroke-dasharray: 4 6; stroke-opacity: .8;
              animation: dash 1.4s linear infinite; }
      .node { fill: #0F1915; stroke: #2B3D35; stroke-width: 1.2; }
      .node-hl { fill: #0F1915; stroke: #3DDC84; stroke-width: 1.4; }
      .n-title { fill: #E8F2EC; font-size: 14px; font-weight: 600; }
      .n-sub { fill: #3DDC84; font-size: 12px; }
      .n-sub-muted { fill: #7F948A; font-size: 12px; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -22; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .flow, .loop, .pulse { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <!-- background -->
    <rect width="1200" height="360" fill="#0B1310"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="260" cy="190" rx="360" ry="220" fill="url(#glowLeft)"/>
    <ellipse cx="900" cy="190" rx="340" ry="200" fill="url(#glowGraph)"/>

    <!-- left: identity -->
    <g class="mono">
      <circle class="pulse" cx="78" cy="98" r="5" fill="#3DDC84"/>
      <text x="94" y="103" fill="#3DDC84" font-size="16">~/emrecangok</text>
    </g>
    <text class="sans" x="72" y="178" fill="#E8F2EC" font-size="64" font-weight="700">Emrecan Gök</text>
    <text class="sans" x="74" y="224" fill="#A9BDB3" font-size="26" font-weight="500">AI Engineer</text>
    <text class="mono" x="74" y="270" fill="#7F948A" font-size="15">LLM agents · RAG · computer vision</text>
    <text class="sans" x="74" y="300" fill="#5E7268" font-size="14">Istanbul · Computer Engineering, Gazi University</text>

    <!-- right: agent flow -->
    <g class="sans">
      <path class="flow" d="M780 94H818" marker-end="url(#arr)"/>
      <path class="flow" d="M950 94H988" marker-end="url(#arr)"/>
      <path class="flow" d="M1055 118V163" marker-end="url(#arr)"/>
      <path class="flow" d="M1055 213V258" marker-end="url(#arr)"/>
      <path class="loop" d="M990 189H952" marker-end="url(#arrLoop)"/>
      <path class="loop" d="M885 165V138H1012V121" marker-end="url(#arrLoop)"/>
      <text class="mono" x="900" y="157" fill="#F5B342" font-size="11" fill-opacity=".85">retry</text>

      <rect class="node" x="650" y="70" width="130" height="48" rx="10"/>
      <text class="n-title" x="664" y="90">question</text>
      <text class="n-sub-muted mono" x="664" y="107">TR / EN</text>

      <rect class="node" x="820" y="70" width="130" height="48" rx="10"/>
      <text class="n-title" x="834" y="90">router</text>
      <text class="n-sub mono" x="834" y="107">intent</text>

      <rect class="node" x="990" y="70" width="130" height="48" rx="10"/>
      <text class="n-title" x="1004" y="90">retrieve</text>
      <text class="n-sub mono" x="1004" y="107">vector search</text>

      <rect class="node" x="990" y="165" width="130" height="48" rx="10"/>
      <text class="n-title" x="1004" y="185">grade</text>
      <text class="n-sub mono" x="1004" y="202">relevant?</text>

      <rect class="node" x="820" y="165" width="130" height="48" rx="10"/>
      <text class="n-title" x="834" y="185">rewrite</text>
      <text class="n-sub-muted mono" x="834" y="202">query</text>

      <rect class="node-hl" x="990" y="260" width="130" height="48" rx="10"/>
      <text class="n-title" x="1004" y="280">answer</text>
      <text class="n-sub mono" x="1004" y="297">file · page</text>
    </g>
  </g>
</svg>
