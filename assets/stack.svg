<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-labelledby="title description">
  <title id="title">Tech stack</title>
  <desc id="description">Agents: LangGraph, LangChain, RAG, Chroma, Hugging Face. Vision: YOLO, OpenCV, SIFT / ORB, Kalman Filter. Languages: Python, C#, SQL. Serving: FastAPI, Streamlit, Docker. Interests: Generative AI, Computer Vision, Autonomous Systems.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#13201B" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity=".08"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="310" rx="20"/></clipPath>
    <style>
      .mono { font-family: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
      .key { fill: #3DDC84; font-size: 15px; }
      .pill rect { fill: #0F1915; stroke: #2B3D35; }
      .pill text { fill: #DCE9E2; font-size: 14px; }
      .fade { opacity: 0; animation: fadeIn .6s ease-out forwards; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      .scan { animation: scan 5s linear infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
      @keyframes fadeIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
      @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(330px); } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .scan { animation: none; }
        .scan { display: none; }
        .fade { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)" class="mono">
    <rect width="1200" height="310" fill="#0A110E"/>
    <rect width="1200" height="310" fill="url(#grid)"/>
    <circle cx="1150" cy="300" r="140" fill="#2DD4BF" fill-opacity=".05"/>
    <rect class="scan" x="0" y="0" width="1200" height="70" fill="url(#scan)"/>

    <!-- window bar -->
    <rect x="0" y="0" width="1200" height="48" fill="#0F1915"/>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#1E2D27"/>
    <circle cx="32" cy="24" r="6" fill="#F5B342" fill-opacity=".8"/>
    <circle cx="52" cy="24" r="6" fill="#2DD4BF" fill-opacity=".8"/>
    <circle cx="72" cy="24" r="6" fill="#3DDC84" fill-opacity=".8"/>
    <text x="600" y="29" fill="#7F948A" font-size="14" text-anchor="middle">~/emrecangok/stack.yaml</text>
    <circle class="pulse" cx="1158" cy="24" r="4" fill="#3DDC84" filter="url(#soft)"/>

    <!-- agents -->
    <g class="fade" style="animation-delay: .2s">
      <text class="key" x="60" y="105">agents:</text>
    </g>
    <g class="pill fade" style="animation-delay: .3s"><rect x="230" y="85" width="117" height="30" rx="15"/><circle class="pulse" cx="246" cy="100" r="4" fill="#3DDC84"/><text x="258" y="105">LangGraph</text></g>
    <g class="pill fade" style="animation-delay: .38s"><rect x="359" y="85" width="117" height="30" rx="15"/><circle class="pulse" style="animation-delay: .3s" cx="375" cy="100" r="4" fill="#3DDC84"/><text x="387" y="105">LangChain</text></g>
    <g class="pill fade" style="animation-delay: .46s"><rect x="488" y="85" width="63" height="30" rx="15"/><circle class="pulse" style="animation-delay: .6s" cx="504" cy="100" r="4" fill="#3DDC84"/><text x="516" y="105">RAG</text></g>
    <g class="pill fade" style="animation-delay: .54s"><rect x="563" y="85" width="90" height="30" rx="15"/><circle class="pulse" style="animation-delay: .9s" cx="579" cy="100" r="4" fill="#3DDC84"/><text x="591" y="105">Chroma</text></g>
    <g class="pill fade" style="animation-delay: .62s"><rect x="665" y="85" width="144" height="30" rx="15"/><circle class="pulse" style="animation-delay: 1.2s" cx="681" cy="100" r="4" fill="#3DDC84"/><text x="693" y="105">Hugging Face</text></g>

    <!-- vision -->
    <g class="fade" style="animation-delay: .6s">
      <text class="key" x="60" y="157">vision:</text>
    </g>
    <g class="pill fade" style="animation-delay: .7s"><rect x="230" y="137" width="72" height="30" rx="15"/><circle class="pulse" cx="246" cy="152" r="4" fill="#F5B342"/><text x="258" y="157">YOLO</text></g>
    <g class="pill fade" style="animation-delay: .78s"><rect x="314" y="137" width="90" height="30" rx="15"/><circle class="pulse" style="animation-delay: .3s" cx="330" cy="152" r="4" fill="#F5B342"/><text x="342" y="157">OpenCV</text></g>
    <g class="pill fade" style="animation-delay: .86s"><rect x="416" y="137" width="126" height="30" rx="15"/><circle class="pulse" style="animation-delay: .6s" cx="432" cy="152" r="4" fill="#F5B342"/><text x="444" y="157">SIFT / ORB</text></g>
    <g class="pill fade" style="animation-delay: .94s"><rect x="554" y="137" width="153" height="30" rx="15"/><circle class="pulse" style="animation-delay: .9s" cx="570" cy="152" r="4" fill="#F5B342"/><text x="582" y="157">Kalman Filter</text></g>

    <!-- languages -->
    <g class="fade" style="animation-delay: 1s">
      <text class="key" x="60" y="209">languages:</text>
    </g>
    <g class="pill fade" style="animation-delay: 1.1s"><rect x="230" y="189" width="90" height="30" rx="15"/><circle class="pulse" cx="246" cy="204" r="4" fill="#2DD4BF"/><text x="258" y="209">Python</text></g>
    <g class="pill fade" style="animation-delay: 1.18s"><rect x="332" y="189" width="54" height="30" rx="15"/><circle class="pulse" style="animation-delay: .3s" cx="348" cy="204" r="4" fill="#2DD4BF"/><text x="360" y="209">C#</text></g>
    <g class="pill fade" style="animation-delay: 1.26s"><rect x="398" y="189" width="63" height="30" rx="15"/><circle class="pulse" style="animation-delay: .6s" cx="414" cy="204" r="4" fill="#2DD4BF"/><text x="426" y="209">SQL</text></g>

    <!-- serving -->
    <g class="fade" style="animation-delay: 1.4s">
      <text class="key" x="60" y="261">serving:</text>
    </g>
    <g class="pill fade" style="animation-delay: 1.5s"><rect x="230" y="241" width="99" height="30" rx="15"/><circle class="pulse" cx="246" cy="256" r="4" fill="#7DD3FC"/><text x="258" y="261">FastAPI</text></g>
    <g class="pill fade" style="animation-delay: 1.58s"><rect x="341" y="241" width="117" height="30" rx="15"/><circle class="pulse" style="animation-delay: .3s" cx="357" cy="256" r="4" fill="#7DD3FC"/><text x="369" y="261">Streamlit</text></g>
    <g class="pill fade" style="animation-delay: 1.66s"><rect x="470" y="241" width="90" height="30" rx="15"/><circle class="pulse" style="animation-delay: .6s" cx="486" cy="256" r="4" fill="#7DD3FC"/><text x="498" y="261">Docker</text></g>

    <!-- interests panel -->
    <g class="fade" style="animation-delay: 1.9s">
      <rect x="880" y="82" width="270" height="192" rx="16" fill="#0F1915" stroke="#2B3D35"/>
      <text x="904" y="116" fill="#7F948A" font-size="14">// interests</text>
      <text x="904" y="158" fill="#3DDC84" font-size="15">▸</text><text x="924" y="158" fill="#DCE9E2" font-size="15">Generative AI</text>
      <text x="904" y="198" fill="#F5B342" font-size="15">▸</text><text x="924" y="198" fill="#DCE9E2" font-size="15">Computer Vision</text>
      <text x="904" y="238" fill="#2DD4BF" font-size="15">▸</text><text x="924" y="238" fill="#DCE9E2" font-size="15">Autonomous Systems</text>
      <rect x="1104" y="225" width="9" height="17" fill="#3DDC84">
        <animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.5"/>
      </rect>
    </g>
  </g>
</svg>
