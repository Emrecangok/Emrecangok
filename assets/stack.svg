<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 162" width="700" height="162" role="img" aria-labelledby="title description">
  <title id="title">Tech stack</title>
  <desc id="description">Agents: LangGraph, LangChain, RAG, Chroma, Hugging Face. Vision: YOLO, OpenCV, SIFT / ORB, Kalman Filter. Languages: Python, C#, SQL. Serving: FastAPI, Streamlit, Docker.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#13201B" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="700" height="162" rx="14"/></clipPath>
    <style>
      .mono { font-family: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
      .key { fill: #3DDC84; font-size: 13px; }
      .pill rect { fill: #0F1915; stroke: #2B3D35; }
      .pill text { fill: #DCE9E2; font-size: 13px; }
      .fade { opacity: 0; animation: fadeIn .5s ease-out forwards; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
      @keyframes fadeIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; }
        .fade { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)" class="mono">
    <rect width="700" height="162" fill="#0A110E"/>
    <rect width="700" height="162" fill="url(#grid)"/>

    <!-- agents -->
    <g class="fade" style="animation-delay: .1s"><text class="key" x="24" y="35">agents:</text></g>
    <g class="pill fade" style="animation-delay: .15s"><rect x="150" y="18" width="102" height="24" rx="12"/><circle class="pulse" cx="164" cy="30" r="3.5" fill="#3DDC84"/><text x="175" y="34.5">LangGraph</text></g>
    <g class="pill fade" style="animation-delay: .2s"><rect x="262" y="18" width="102" height="24" rx="12"/><circle class="pulse" style="animation-delay: .3s" cx="276" cy="30" r="3.5" fill="#3DDC84"/><text x="287" y="34.5">LangChain</text></g>
    <g class="pill fade" style="animation-delay: .25s"><rect x="374" y="18" width="54" height="24" rx="12"/><circle class="pulse" style="animation-delay: .6s" cx="388" cy="30" r="3.5" fill="#3DDC84"/><text x="399" y="34.5">RAG</text></g>
    <g class="pill fade" style="animation-delay: .3s"><rect x="438" y="18" width="78" height="24" rx="12"/><circle class="pulse" style="animation-delay: .9s" cx="452" cy="30" r="3.5" fill="#3DDC84"/><text x="463" y="34.5">Chroma</text></g>
    <g class="pill fade" style="animation-delay: .35s"><rect x="526" y="18" width="126" height="24" rx="12"/><circle class="pulse" style="animation-delay: 1.2s" cx="540" cy="30" r="3.5" fill="#3DDC84"/><text x="551" y="34.5">Hugging Face</text></g>

    <!-- vision -->
    <g class="fade" style="animation-delay: .35s"><text class="key" x="24" y="69">vision:</text></g>
    <g class="pill fade" style="animation-delay: .4s"><rect x="150" y="52" width="62" height="24" rx="12"/><circle class="pulse" cx="164" cy="64" r="3.5" fill="#F5B342"/><text x="175" y="68.5">YOLO</text></g>
    <g class="pill fade" style="animation-delay: .45s"><rect x="222" y="52" width="78" height="24" rx="12"/><circle class="pulse" style="animation-delay: .3s" cx="236" cy="64" r="3.5" fill="#F5B342"/><text x="247" y="68.5">OpenCV</text></g>
    <g class="pill fade" style="animation-delay: .5s"><rect x="310" y="52" width="110" height="24" rx="12"/><circle class="pulse" style="animation-delay: .6s" cx="324" cy="64" r="3.5" fill="#F5B342"/><text x="335" y="68.5">SIFT / ORB</text></g>
    <g class="pill fade" style="animation-delay: .55s"><rect x="430" y="52" width="134" height="24" rx="12"/><circle class="pulse" style="animation-delay: .9s" cx="444" cy="64" r="3.5" fill="#F5B342"/><text x="455" y="68.5">Kalman Filter</text></g>

    <!-- languages -->
    <g class="fade" style="animation-delay: .6s"><text class="key" x="24" y="103">languages:</text></g>
    <g class="pill fade" style="animation-delay: .65s"><rect x="150" y="86" width="78" height="24" rx="12"/><circle class="pulse" cx="164" cy="98" r="3.5" fill="#2DD4BF"/><text x="175" y="102.5">Python</text></g>
    <g class="pill fade" style="animation-delay: .7s"><rect x="238" y="86" width="46" height="24" rx="12"/><circle class="pulse" style="animation-delay: .3s" cx="252" cy="98" r="3.5" fill="#2DD4BF"/><text x="263" y="102.5">C#</text></g>
    <g class="pill fade" style="animation-delay: .75s"><rect x="294" y="86" width="54" height="24" rx="12"/><circle class="pulse" style="animation-delay: .6s" cx="308" cy="98" r="3.5" fill="#2DD4BF"/><text x="319" y="102.5">SQL</text></g>

    <!-- serving -->
    <g class="fade" style="animation-delay: .85s"><text class="key" x="24" y="137">serving:</text></g>
    <g class="pill fade" style="animation-delay: .9s"><rect x="150" y="120" width="86" height="24" rx="12"/><circle class="pulse" cx="164" cy="132" r="3.5" fill="#7DD3FC"/><text x="175" y="136.5">FastAPI</text></g>
    <g class="pill fade" style="animation-delay: .95s"><rect x="246" y="120" width="102" height="24" rx="12"/><circle class="pulse" style="animation-delay: .3s" cx="260" cy="132" r="3.5" fill="#7DD3FC"/><text x="271" y="136.5">Streamlit</text></g>
    <g class="pill fade" style="animation-delay: 1s"><rect x="358" y="120" width="78" height="24" rx="12"/><circle class="pulse" style="animation-delay: .6s" cx="372" cy="132" r="3.5" fill="#7DD3FC"/><text x="383" y="136.5">Docker</text></g>
  </g>
</svg>
