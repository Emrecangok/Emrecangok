<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 314" width="1000" height="314" role="img" aria-labelledby="title description">
  <title id="title">Tech stack</title>
  <desc id="description">Agents and RAG: LangGraph, LangChain, RAG, Chroma, Hugging Face. Computer vision: YOLO, OpenCV, SIFT / ORB, Kalman Filter. Languages: Python, C#, SQL. Serving and tools: FastAPI, Streamlit, Docker.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#13201B" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
      .panel { fill: #0A110E; stroke: #22332B; stroke-width: 1.2; }
      .head { fill: #EEF6F1; font-size: 19px; font-weight: 700; }
      .pill rect { fill: #0F1915; stroke: #2B3D35; stroke-width: 1.2; }
      .pill text { fill: #DCE9E2; font-size: 17px; }
      .fade { opacity: 0; animation: fadeIn .6s ease-out forwards; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; }
        .fade { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <!-- agents & rag -->
  <g class="fade" style="animation-delay: .1s">
    <rect class="panel" x="1" y="1" width="488" height="168" rx="16"/>
    <rect x="1" y="1" width="488" height="168" rx="16" fill="url(#grid)" opacity=".7"/>
    <path d="M17 1.6H473" stroke="#3DDC84" stroke-width="2" stroke-opacity=".7"/>
    <circle class="pulse" cx="30" cy="34" r="6" fill="#3DDC84"/>
    <text class="sans head" x="46" y="41">Agents &amp; RAG</text>
    <g class="mono">
      <g class="pill"><rect x="24" y="62" width="132" height="36" rx="18"/><circle class="pulse" cx="40" cy="80" r="4.5" fill="#3DDC84"/><text x="54" y="86">LangGraph</text></g>
      <g class="pill"><rect x="166" y="62" width="132" height="36" rx="18"/><circle class="pulse" style="animation-delay: .3s" cx="182" cy="80" r="4.5" fill="#3DDC84"/><text x="196" y="86">LangChain</text></g>
      <g class="pill"><rect x="308" y="62" width="71" height="36" rx="18"/><circle class="pulse" style="animation-delay: .6s" cx="324" cy="80" r="4.5" fill="#3DDC84"/><text x="338" y="86">RAG</text></g>
      <g class="pill"><rect x="24" y="108" width="101" height="36" rx="18"/><circle class="pulse" style="animation-delay: .9s" cx="40" cy="126" r="4.5" fill="#3DDC84"/><text x="54" y="132">Chroma</text></g>
      <g class="pill"><rect x="135" y="108" width="162" height="36" rx="18"/><circle class="pulse" style="animation-delay: 1.2s" cx="151" cy="126" r="4.5" fill="#3DDC84"/><text x="165" y="132">Hugging Face</text></g>
    </g>
  </g>

  <!-- computer vision -->
  <g class="fade" style="animation-delay: .3s">
    <rect class="panel" x="511" y="1" width="488" height="168" rx="16"/>
    <rect x="511" y="1" width="488" height="168" rx="16" fill="url(#grid)" opacity=".7"/>
    <path d="M527 1.6H983" stroke="#F5B342" stroke-width="2" stroke-opacity=".7"/>
    <circle class="pulse" cx="540" cy="34" r="6" fill="#F5B342"/>
    <text class="sans head" x="556" y="41">Computer Vision</text>
    <g class="mono">
      <g class="pill"><rect x="534" y="62" width="81" height="36" rx="18"/><circle class="pulse" cx="550" cy="80" r="4.5" fill="#F5B342"/><text x="564" y="86">YOLO</text></g>
      <g class="pill"><rect x="625" y="62" width="101" height="36" rx="18"/><circle class="pulse" style="animation-delay: .3s" cx="641" cy="80" r="4.5" fill="#F5B342"/><text x="655" y="86">OpenCV</text></g>
      <g class="pill"><rect x="736" y="62" width="142" height="36" rx="18"/><circle class="pulse" style="animation-delay: .6s" cx="752" cy="80" r="4.5" fill="#F5B342"/><text x="766" y="86">SIFT / ORB</text></g>
      <g class="pill"><rect x="534" y="108" width="173" height="36" rx="18"/><circle class="pulse" style="animation-delay: .9s" cx="550" cy="126" r="4.5" fill="#F5B342"/><text x="564" y="132">Kalman Filter</text></g>
    </g>
  </g>

  <!-- languages -->
  <g class="fade" style="animation-delay: .5s">
    <rect class="panel" x="1" y="189" width="488" height="124" rx="16"/>
    <rect x="1" y="189" width="488" height="124" rx="16" fill="url(#grid)" opacity=".7"/>
    <path d="M17 189.6H473" stroke="#2DD4BF" stroke-width="2" stroke-opacity=".7"/>
    <circle class="pulse" cx="30" cy="222" r="6" fill="#2DD4BF"/>
    <text class="sans head" x="46" y="229">Languages</text>
    <g class="mono">
      <g class="pill"><rect x="24" y="252" width="101" height="36" rx="18"/><circle class="pulse" cx="40" cy="270" r="4.5" fill="#2DD4BF"/><text x="54" y="276">Python</text></g>
      <g class="pill"><rect x="135" y="252" width="61" height="36" rx="18"/><circle class="pulse" style="animation-delay: .3s" cx="151" cy="270" r="4.5" fill="#2DD4BF"/><text x="165" y="276">C#</text></g>
      <g class="pill"><rect x="206" y="252" width="71" height="36" rx="18"/><circle class="pulse" style="animation-delay: .6s" cx="222" cy="270" r="4.5" fill="#2DD4BF"/><text x="236" y="276">SQL</text></g>
    </g>
  </g>

  <!-- serving & tools -->
  <g class="fade" style="animation-delay: .7s">
    <rect class="panel" x="511" y="189" width="488" height="124" rx="16"/>
    <rect x="511" y="189" width="488" height="124" rx="16" fill="url(#grid)" opacity=".7"/>
    <path d="M527 189.6H983" stroke="#7DD3FC" stroke-width="2" stroke-opacity=".7"/>
    <circle class="pulse" cx="540" cy="222" r="6" fill="#7DD3FC"/>
    <text class="sans head" x="556" y="229">Serving &amp; Tools</text>
    <g class="mono">
      <g class="pill"><rect x="534" y="252" width="111" height="36" rx="18"/><circle class="pulse" cx="550" cy="270" r="4.5" fill="#7DD3FC"/><text x="564" y="276">FastAPI</text></g>
      <g class="pill"><rect x="655" y="252" width="132" height="36" rx="18"/><circle class="pulse" style="animation-delay: .3s" cx="671" cy="270" r="4.5" fill="#7DD3FC"/><text x="685" y="276">Streamlit</text></g>
      <g class="pill"><rect x="797" y="252" width="101" height="36" rx="18"/><circle class="pulse" style="animation-delay: .6s" cx="813" cy="270" r="4.5" fill="#7DD3FC"/><text x="827" y="276">Docker</text></g>
    </g>
  </g>
</svg>
