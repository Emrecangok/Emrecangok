<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Emrecan Gök, AI Engineer: LLM agents, RAG and computer vision">
  <title>Emrecan Gök, AI Engineer: LLM agents, RAG and computer vision</title>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#14211C" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#16C172" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#16C172" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="600" height="300" rx="20"/></clipPath>
    <style>
      .sans { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="600" height="300" fill="#0B1310"/>
    <rect width="600" height="300" fill="url(#grid)"/>
    <ellipse cx="300" cy="150" rx="320" ry="180" fill="url(#glow)"/>

    <g class="mono" text-anchor="middle">
      <circle class="pulse" cx="232" cy="78" r="5" fill="#3DDC84"/>
      <text x="306" y="83" fill="#3DDC84" font-size="16">~/emrecangok</text>
    </g>
    <text class="sans" x="300" y="148" fill="#E8F2EC" font-size="52" font-weight="700" text-anchor="middle">Emrecan Gök</text>
    <text class="sans" x="300" y="188" fill="#A9BDB3" font-size="24" font-weight="500" text-anchor="middle">AI Engineer</text>
    <text class="mono" x="300" y="230" fill="#7F948A" font-size="15" text-anchor="middle">LLM agents · RAG · computer vision</text>
  </g>
</svg>
